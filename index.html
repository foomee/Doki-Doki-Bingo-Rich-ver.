<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドキドキビンゴ</title>
    <link rel="stylesheet" href="css/style.css">    
</head>
<body>
    <!-- モーダル部分 -->
    <div class="modal">
        <div class="modal-content">
            BINGO!!
        </div>
    </div>

    <!-- ビンゴ部分 -->
    <div class="container">
        <div class="left">
            <div class="bingo-table">
            </div>        
        </div>

        <div class="right">
            <div class="lottery">
                <div id="result">?</div>
                <button id="draw-button" disabled>抽選する</button>
            </div>
            <div class="history">
            </div>
        </div>
    </div>

    <div class="container player-area">
        <div class="player-card"></div>
        <button id="generate-button">カードを生成する</button>
    </div>

    <div class="container">
        <div class="guide-area">
            <h2>遊び方</h2>
            <p>
                はじめに「カードを生成する」ボタンを押してください。<br>
                抽選を開始するまでは、何度でもカードを生成できます。
            </p>

            <hr>

            <h2>ランダムイベント（未実装）</h2>
            <p id="event-description">⚠️抽選中に、様々なイベントが発生することがあります⚠️</p>
            <h3>🎯ラッキーナンバー</h3>
            <p>好きな数字を選ぶことができます。</p>
            <h3>🔄リロールチャンス</h3>
            <p>数字を引き直すことができます。</p>
            <h3>💀アンラッキーナンバー</h3>
            <p>ランダムに数字が選ばれて、その数字が抽選前に戻ります。</p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
